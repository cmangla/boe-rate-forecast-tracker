name: Scrape latest data and update BoE plots

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'plots/**'
  workflow_dispatch:
  schedule:
    - cron: '1 3 * * *'

permissions:
  contents: write

concurrency:
  group: scrape-and-plot
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Fetch latest bank pages and extract raw CSV tables
        if: github.event_name != 'push'
        run: |
          wget 'https://www.scotiabank.com/ca/en/about/economics/forecast-snapshot.html' -O scotiabank-forecast-snapshot.html
          wget 'https://think.ing.com/forecasts' -O ing-forecasts.html \
            || wget --no-check-certificate 'https://think.ing.com/forecasts' -O ing-forecasts.html
          uv run python table-scrape.py

      - name: Commit raw HTML + CSV tables only if extracted CSV data changed
        id: raw_scrape
        run: |
          git config user.name "GH Action"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- '*.csv')" ]; then
            echo "csv_changed=true" >> "$GITHUB_OUTPUT"
            git add -- *.html *.csv
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Latest raw tables: ${timestamp}"
            git push
          else
            git checkout -- *.html 2>/dev/null || true
            echo "csv_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update append-only BoE tables (strict schema validation)
        id: boe_update
        run: |
          uv run python scripts/update_boe_tables.py
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "boe_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "boe_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up R
        if: steps.boe_update.outputs.boe_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        if: steps.boe_update.outputs.boe_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::readr
            any::lubridate
            any::scales
            any::ggrepel
            any::ggtext
            any::ggnewscale
            any::patchwork
            any::broom
            any::ragg
            any::svglite

      - name: Render BoE ggplot2 charts
        if: steps.boe_update.outputs.boe_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/generate_plots.R

      - name: Commit and push updated BoE tables and plots
        if: steps.boe_update.outputs.boe_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GH Action"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/ plots/
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "Update BoE rate tables and plots: ${timestamp}" || exit 0
          git push
